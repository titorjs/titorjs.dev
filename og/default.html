<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>og default</title>
  <style>
    /* Source for default.png. Values mirror the dark block of src/styles/tokens.css. */
    @font-face {
      font-family: 'JetBrains Mono';
      font-weight: 100 800;
      src: url('../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'IBM Plex Sans';
      font-weight: 400;
      src: url('../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2') format('woff2');
    }
    html, body { margin: 0; }
    body {
      width: 1200px;
      height: 630px;
      background: #0a0d14;
      color: #e4e8f0;
      font-family: 'IBM Plex Sans', sans-serif;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 72px 80px;
      box-sizing: border-box;
      border-top: 8px solid #5b8cff;
    }
    .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #5b8cff;
    }
    .main { align-self: center; display: grid; gap: 28px; }
    h1 {
      margin: 0;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 96px;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    h1 span { color: #5b8cff; font-weight: 400; }
    p { margin: 0; font-size: 32px; line-height: 1.4; color: #8893a6; }
    .site {
      font-family: 'JetBrains Mono', monospace;
      font-size: 26px;
      color: #8893a6;
    }
    .site b { color: #e4e8f0; font-weight: 600; }
  </style>
</head>
<body>
  <div class="label">Quito, Ecuador · UTC−5</div>
  <div class="main">
    <h1><span>// </span>Tito Jaramillo</h1>
    <p>Ingeniero de software · Backend Java/Spring · Camino hacia la IA</p>
  </div>
  <div class="site"><b>titorjs</b>.dev</div>
</body>
</html>
